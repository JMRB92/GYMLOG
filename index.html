input,select,textarea{width:100%;padding:11px 12px;border:1px solid #cfcfcf;border-radius:10px;background:#fff;color:var(--ink);outline:none}

label{font-size:13px;color:#555;display:block;margin-bottom:6px;font-weight:650}
.app{max-width:1100px;margin:auto;padding-bottom:86px}

.brandlockup{display:flex;align-items:center;gap:11px;min-width:0}
.brand-logo{width:48px;height:48px;object-fit:cover;border-radius:12px;border:1px solid #ffcc00;box-shadow:0 0 0 2px #ed1c242b}
.brandtext{min-width:0}
.brand{font-size:22px;line-height:1.05;font-weight:950;letter-spacing:1.1px;color:#fff}
.brand span{color:var(--yellow)}
.top small{color:#d2d2d2;font-size:12px}
.top .row{gap:7px}
.top button{font-size:12px;padding:9px 11px;white-space:nowrap}

.top button[data-action="share-link"]:hover{background:#fff!important;color:#111!important;border-color:#fff!important}
main{padding:16px}

.nav button.active{color:#111;background:var(--yellow)}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}

.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:12px}

.subtitle{font-weight:850;font-size:18px;margin:4px 0 11px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}

.pill{border-radius:99px;background:#fff1a6;color:#302700;padding:5px 10px;font-size:12px;font-weight:750}
.daystrip{display:flex;gap:7px;overflow:auto;padding:4px 0 12px}

.exercise{padding:14px 0;border-top:1px solid var(--line)}

.sethead,.setrow{display:grid;grid-template-columns:32px minmax(62px,1fr) minmax(62px,1fr) 54px;gap:7px;align-items:center}
.sethead{font-size:11px;color:var(--muted);padding:6px 0;font-weight:700}
.setrow{margin:5px 0}
.setrow input{padding:9px 5px;text-align:center}
.setrow button{padding:9px 0}
.done{background:#dcfce7!important;color:#166534!important}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px}
.empty{padding:32px 16px;text-align:center;color:var(--muted);background:#fff;border:1px dashed #ccc;border-radius:14px}
.fieldgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:11px}
.timer{font-size:52px;font-weight:900;text-align:center;font-variant-numeric:tabular-nums;padding:20px 0}
.progressbar{height:9px;background:#e7e7e7;border-radius:10px;overflow:hidden}
.progressbar div{height:100%;background:linear-gradient(90deg,var(--red),var(--yellow))}
.notice{background:#fff6c7;border:1px solid #f1d34f;color:#3f3200;padding:12px;border-radius:11px;margin-bottom:13px}
.hidden{display:none!important}
.tag{font-size:12px;color:var(--muted)}
.stickytools{position:sticky;top:60px;z-index:4;background:var(--bg);padding:7px 0 10px}
.exercise-title{font-weight:800}
.backupbox{border:1px dashed #b7a03c;background:#fffdf2;padding:14px;border-radius:12px}
.version-tag{position:fixed;right:8px;bottom:76px;font-size:10px;color:#777;opacity:.8;z-index:9;pointer-events:none;background:#fff;padding:3px 6px;border:1px solid #e5e5e5;border-radius:6px}
.hr{border:0;border-top:1px solid var(--line);margin:15px 0}
h3{margin:0 0 5px}
p{margin:6px 0 10px}
a{color:#a30e16}
@media(max-width:520px){
 .top{padding:9px 10px;gap:6px}.brand-logo{width:40px;height:40px}.brand{font-size:19px}.top small{font-size:11px}.top button{padding:8px 9px;font-size:11px}

@media(min-width:700px){

}
</style></head>

function homeView(){const orderedRoutines=[...db.routines].sort((a,b)=>(a.id===db.lastRoutine?-1:b.id===db.lastRoutine?1:0));return `<div class="title">¿Qué entrenamos hoy?</div>${db.activeSession?`<div class="card"><div class="row between"><div><div class="subtitle">Entrenamiento pendiente</div><div class="muted">${esc(db.activeSession.routineNameSnapshot)} · ${esc(db.activeSession.dayNameSnapshot)}</div></div><span class="pill">En curso</span></div><div class="actions"><button data-action="resume">Reanudar entrenamiento</button><button class="secondary" data-action="discard-session">Descartar</button></div></div>`:''}<div class="subtitle">Tus rutinas</div><div class="grid">${orderedRoutines.map(r=>`<div class="card"><div class="subtitle">${esc(r.name)}${r.id===db.lastRoutine?'<span class="pill" style="margin-left:8px">Última rutina</span>':''}</div><div class="muted small">${r.days.length} días · ${r.days.map(d=>esc(d.name)).join(' · ')}</div><div class="actions"><button data-action="choose-start" data-id="${r.id}">Empezar</button><button class="secondary" data-action="routine-edit" data-id="${r.id}">Editar</button></div></div>`).join('')}</div><div class="card"><div class="subtitle">Acceso rápido</div><div class="actions"><button class="secondary" data-go="routines">Crear o importar rutina</button><button class="secondary" data-go="history">Ver historial</button></div></div>`}
function routinesView(){return `<div class="section-head"><div class="title">Rutinas</div><button data-action="new-routine">＋ Nueva</button></div><div class="card"><div class="subtitle">Crear desde texto</div><p class="muted small">Pega una rutina. La aplicación detecta días, ejercicios, series y repeticiones; podrás revisar el resultado antes de guardarlo.</p><button class="secondary" data-action="import-text">Importar desde texto</button></div><div class="grid">${orderedRoutines.map(r=>`<div class="card"><div class="subtitle">${esc(r.name)}${r.id===db.lastRoutine?'<span class="pill" style="margin-left:8px">Última rutina</span>':''}</div><p class="muted small">${r.days.length} días · ${r.days.reduce((n,d)=>n+d.exercises.length,0)} ejercicios</p><div class="actions"><button data-action="routine-edit" data-id="${r.id}">Editar</button><button class="secondary" data-action="choose-start" data-id="${r.id}">Empezar</button><button class="secondary" data-action="share-routine" data-id="${r.id}">Compartir rutina</button><button class="ghost" data-action="duplicate-routine" data-id="${r.id}">Duplicar</button><button class="danger" data-action="delete-routine" data-id="${r.id}">Eliminar</button></div></div>`).join('')}</div>`}
function workoutView(){const s=db.activeSession;if(!s)return `<div class="empty">No hay entrenamiento activo.<br><button data-go="home">Volver al inicio</button></div>`;return `<div class="stickytools"><div class="row between"><button class="secondary" data-action="show-routine">← Rutina</button><button data-action="open-timer">⏱ Temporizador ${timer.running?formatTime(getRemaining()):''}</button></div><div class="row between" style="margin-top:10px"><div><div class="title" style="font-size:21px;margin:0">${esc(s.routineNameSnapshot)}</div><div class="muted small">${esc(s.dayNameSnapshot)} · iniciado ${new Date(s.startedAt).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})}</div></div><div class="actions" style="margin:0"><button class="secondary" data-action="save-exit-session">Guardar y salir</button><button data-action="finish-session">Finalizar</button></div></div></div><div class="card"><div class="section-head"><div class="subtitle">Ejercicios</div><button class="secondary" data-action="add-session-ex">＋ Añadir</button></div>${s.exercises.map((e,i)=>exerciseSessionView(e,i)).join('')}<div class="actions"><button data-action="finish-session">Finalizar y guardar</button></div></div>`}
function exerciseSessionView(e,i){let prev=latestFor(e);return `<div class="exercise"><div class="row between"><div><div class="exercise-title">${i+1}. ${esc(e.name)}</div><div class="tag">${esc(e.variant||findExercise(e.exerciseId)?.equipment||'')}</div></div><div class="actions" style="margin:0"><button class="ghost" data-action="session-replace-ex" data-ex="${e.id}">Cambiar</button><button class="ghost" data-action="session-ex-notes" data-id="${e.id}">Notas</button></div></div><div class="small muted" style="margin:5px 0 8px">Anterior: ${prev?prev.sets.map(s=>`${s.weight!==''?s.weight+' '+db.settings.unit+' × ':''}${s.reps||s.duration||'—'}`).join(' · '):'sin registros previos'}</div><div class="sethead"><span>Serie</span><span>Peso (${db.settings.unit})</span><span>${e.metric==='duration'?'Segundos':'Reps'}</span><span>Hecha</span></div>${e.sets.map((s,j)=>`<div class="setrow"><span class="small">${j+1}</span><input aria-label="Peso serie ${j+1}" type="number" min="0" step="any" placeholder="—" value="${esc(s.weight)}" data-set-field="weight" data-ex="${e.id}" data-index="${j}"><input aria-label="Repeticiones serie ${j+1}" type="number" min="0" step="1" placeholder="${e.metric==='duration'?'seg':'reps'}" value="${esc(e.metric==='duration'?s.duration:s.reps)}" data-set-field="${e.metric==='duration'?'duration':'reps'}" data-ex="${e.id}" data-index="${j}"><button class="${s.completed?'done':'secondary'}" data-action="toggle-set" data-ex="${e.id}" data-index="${j}">${s.completed?'✓':'○'}</button></div>`).join('')}<div class="actions"><button class="ghost" data-action="add-set" data-ex="${e.id}">＋ Serie</button><button class="ghost" data-action="remove-set" data-ex="${e.id}">− Serie</button><button class="ghost" data-action="remove-session-ex" data-ex="${e.id}">Quitar ejercicio</button></div></div>`}
function timerView(){return `<div class="title">Temporizador</div><div class="card"><div class="timer" id="timerDigits">${formatTime(getRemaining())}</div><div class="row" style="justify-content:center"><button data-action="timer-toggle">${timer.running?'Pausar':'Iniciar'}</button><button class="secondary" data-action="timer-reset">Reiniciar</button></div><div class="actions" style="justify-content:center"><button class="secondary" data-action="timer-add" data-seconds="15">+15 s</button><button class="secondary" data-action="timer-add" data-seconds="30">+30 s</button><button class="secondary" data-action="timer-add" data-seconds="60">+1 min</button></div><hr class="hr"><div class="fieldgrid"><div><label>Duración (segundos)</label><input type="number" id="timerCustom" min="1" value="${Math.max(1,Math.round(getRemaining()))}"></div><div style="display:flex;align-items:end"><button class="secondary" data-action="timer-set">Configurar</button></div></div><div class="actions"><button class="secondary" data-action="back-workout">Volver al entrenamiento</button><button class="ghost" data-go="home">Inicio</button></div></div><p class="muted small">El temporizador se calcula mediante marcas de tiempo. Algunos navegadores pueden suspender avisos cuando la aplicación está en segundo plano.</p>`}
function chooseDayView(r){return `<div class="title">Elegir día</div><div class="card"><div class="subtitle">${esc(r.name)}</div><p class="muted">Selecciona un día concreto para iniciar el registro.</p>${r.days.map(d=>`<div class="row between" style="padding:8px 0;border-top:1px solid var(--line)"><div><b>${esc(d.name)}</b><div class="small muted">${d.exercises.length} ejercicios</div></div><button data-action="start-day" data-routine="${r.id}" data-day="${d.id}">Empezar</button></div>`).join('')}<div class="actions"><button class="secondary" data-go="home">Cancelar</button></div></div>`}
function libraryView(){let q=window.libQ||'', group=window.libGroup||'Todos';let items=db.library.filter(e=>(!q||(`${e.name} ${e.group} ${e.subgroup} ${e.equipment} ${e.variant}`).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').includes(q.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')))&&(group==='Todos'||e.group===group));return `<div class="title">Biblioteca</div><div class="card"><div class="fieldgrid"><div><label>Buscar ejercicio</label><input id="libSearch" placeholder="Nombre, músculo o equipo..." value="${esc(q)}"></div><div><label>Grupo muscular</label><select id="libGroup"><option>Todos</option>${[...new Set(db.library.map(e=>e.group))].sort().map(g=>`<option ${g===group?'selected':''}>${esc(g)}</option>`).join('')}</select></div></div><div class="actions"><button data-action="new-exercise">＋ Crear ejercicio</button></div></div><div class="muted small">${items.length} ejercicios</div>${items.slice(0,180).map(e=>`<div class="card"><div class="row between"><div><b>${esc(e.name)}</b><div class="small muted">${esc(e.group)} · ${esc(e.subgroup)} · ${esc(e.equipment)}${e.variant?' · '+esc(e.variant):''}</div></div>${e.isCustom?'<span class="pill">Personalizado</span>':''}</div><div class="actions"><button class="secondary" data-action="edit-exercise" data-id="${e.id}">Editar</button></div></div>`).join('')}` }
function historyView(){let sessions=db.sessions.filter(s=>s.status==='completed').slice().sort((a,b)=>b.completedAt.localeCompare(a.completedAt));return `<div class="title">Historial</div>${sessions.length?sessions.map(s=>`<div class="card"><div class="row between"><div><div class="subtitle">${esc(s.routineNameSnapshot)} · ${esc(s.dayNameSnapshot)}</div><div class="small muted">${new Date(s.completedAt).toLocaleString('es-ES',{dateStyle:'medium',timeStyle:'short'})}</div></div><span class="pill">${s.exercises.reduce((n,e)=>n+e.sets.filter(x=>x.completed).length,0)} series</span></div><div class="actions"><button class="secondary" data-action="view-session" data-id="${s.id}">Ver detalle</button><button class="ghost" data-action="delete-session" data-id="${s.id}">Eliminar</button></div></div>`).join(''):'<div class="card empty">Todavía no has completado ningún entrenamiento.</div>'}`}
function progressView(){let sessions=db.sessions.filter(s=>s.status==='completed');let recent=sessions.filter(s=>Date.now()-Date.parse(s.completedAt)<30*864e5).length;let records={};sessions.forEach(s=>s.exercises.forEach(e=>e.sets.filter(x=>x.completed&&x.weight!==''&&Number(x.weight)>=0).forEach(x=>{let key=e.exerciseNameSnapshot+'|'+(e.variant||'');if(!records[key]||Number(x.weight)>records[key].weight)records[key]={name:e.exerciseNameSnapshot,variant:e.variant,weight:Number(x.weight),date:s.completedAt}})));return `<div class="title">Progreso</div><div class="grid"><div class="card"><div class="muted">Entrenamientos completados</div><div class="title">${sessions.length}</div><div class="small muted">${recent} en los últimos 30 días</div></div><div class="card"><div class="muted">Récords de carga registrados</div><div class="title">${Object.keys(records).length}</div><div class="small muted">Separados por variante</div></div></div><div class="card"><div class="subtitle">Mejores cargas registradas</div>${Object.values(records).sort((a,b)=>b.weight-a.weight).slice(0,30).map(r=>`<div class="row between" style="padding:9px 0;border-top:1px solid var(--line)"><div><b>${esc(r.name)}</b><div class="small muted">${esc(r.variant||'Variante genérica')} · ${new Date(r.date).toLocaleDateString('es-ES')}</div></div><b>${r.weight} ${db.settings.unit}</b></div>`).join('')||'<div class="empty">Aún no hay suficientes datos para mostrar progreso.</div>'}</div>`}
function settingsView(){return `<div class="title">Ajustes y datos</div><div class="card"><div class="subtitle">Preferencias</div><div class="fieldgrid"><div><label>Unidad de peso</label><select id="unit"><option value="kg" ${db.settings.unit==='kg'?'selected':''}>Kilogramos (kg)</option><option value="lb" ${db.settings.unit==='lb'?'selected':''}>Libras (lb)</option></select></div><div><label>Descanso compuesto (segundos)</label><input id="compound" type="number" min="1" value="${db.settings.compound||150}"></div><div><label>Descanso aislamiento (segundos)</label><input id="isolation" type="number" min="1" value="${db.settings.isolation||90}"></div></div><label style="display:flex;gap:8px;align-items:center;margin-top:12px"><input id="autoTimer" type="checkbox" style="width:auto" ${db.settings.autoTimer?'checked':''}> Iniciar descanso automáticamente al completar una serie</label><div class="actions"><button data-action="save-settings">Guardar preferencias</button></div></div><div class="card"><div class="subtitle">Copias de seguridad</div><p class="muted small">Después de guardar una rutina o terminar un entrenamiento, GYM LOG puede sugerirte descargar una copia local. Puedes silenciar el aviso una semana o para siempre. Los datos se guardan en este dispositivo. Las copias son responsabilidad tuya; borrar los datos del navegador puede eliminarlos.</p><div class="actions"><button data-action="backup">Crear copia de seguridad</button><button class="secondary" data-action="restore">Restaurar copia</button><input id="restoreFile" type="file" accept=".json,.gymlog,application/json" class="hidden"></div><hr class="hr"><button class="ghost" data-action="export-all-routines">Exportar rutinas</button></div><div class="card"><div class="subtitle">Privacidad</div><p>GYM LOG funciona localmente y no requiere cuenta. Esta versión no incorpora analítica ni publicidad. Los datos permanecen en el almacenamiento del navegador de este dispositivo; no se sincronizan automáticamente.</p><p class="small muted">Para usarla sin conexión, abre la aplicación una vez desde el dispositivo. La versión HTML independiente no garantiza instalación PWA ni alarmas cuando el navegador está cerrado.</p><button class="danger" data-action="reset">Restablecer todos los datos</button></div>`}
function bind(){ $$('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));$$('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));$$('[data-action]').forEach(b=>b.onclick=()=>action(b));const search=$('#libSearch');if(search)search.oninput=()=>{window.libQ=search.value;const pos=search.selectionStart;render();$('#libSearch')?.focus();$('#libSearch')?.setSelectionRange(pos,pos)};const group=$('#libGroup');if(group)group.onchange=()=>{window.libGroup=group.value;render()};$$('[data-set-field]').forEach(inp=>inp.onchange=()=>{const s=db.activeSession,e=s.exercises.find(e=>e.id===inp.dataset.ex),set=e?.sets[Number(inp.dataset.index)];if(set){set[inp.dataset.setField]=inp.value===''?'':Number(inp.value);save()}});if($('#unit'))$('#unit').onchange=()=>{};if($('#restoreFile'))$('#restoreFile').onchange=restoreFile;}
function action(b){const a=b.dataset.action,id=b.dataset.id;
if(a==='resume'){page='workout';render()}
else if(a==='discard-session'){if(confirm('¿Descartar la sesión sin terminar?')){db.activeSession=null;save();render()}}
else if(a==='choose-start'){const r=findRoutine(id);if(r){window.chooseRoutine=id;$('#main').innerHTML=chooseDayView(r);bind()}}
else if(a==='start-day'){startSession(findRoutine(b.dataset.routine),b.dataset.day)}
else if(a==='new-routine')editRoutine(null)
else if(a==='routine-edit')editRoutine(findRoutine(id))
else if(a==='duplicate-routine'){let r=findRoutine(id);let c=JSON.parse(JSON.stringify(r));c.id=uid();c.name+=' (copia)';c.days.forEach(d=>{d.id=uid();d.exercises.forEach(e=>e.id=uid())});db.routines.push(c);save();render()}
else if(a==='delete-routine'){if(confirm('¿Eliminar la rutina? El historial se conservará.')){db.routines=db.routines.filter(r=>r.id!==id);save();render()}}
else if(a==='export-routine'){let r=findRoutine(id);if(r)download(JSON.stringify({format:'gymlog-routine',version:1,routine:r},null,2),`${safeName(r.name)}.gymlog`,'application/json')}
else if(a==='share-routine'){let r=findRoutine(id);if(r)shareRoutine(r)}
else if(a==='share-link')copyAppLink()
else if(a==='import-text')importText()
else if(a==='new-exercise')editExercise(null)
else if(a==='edit-exercise')editExercise(findExercise(id))
else if(a==='show-routine'){page='workout';render();window.scrollTo(0,0)}
else if(a==='save-exit-session'){save();page='home';render();window.scrollTo(0,0)}
else if(a==='open-timer'){timer.open=true;page='timer';render()}
else if(a==='back-workout'){page=db.activeSession?'workout':'home';render()}
else if(a==='toggle-set'){let s=db.activeSession,e=s?.exercises.find(e=>e.id===b.dataset.ex),set=e?.sets[Number(b.dataset.index)];if(set){set.completed=!set.completed;if(set.completed&&db.settings.autoTimer){timer.remaining=e.rest||120;timer.running=true;timer.end=Date.now()+timer.remaining*1000}save();render()}}
else if(a==='add-set'||a==='remove-set'){let e=db.activeSession?.exercises.find(e=>e.id===b.dataset.ex);if(e){if(a==='add-set')e.sets.push({id:uid(),weight:'',reps:'',duration:'',completed:false});else if(e.sets.length>1)e.sets.pop();save();render()}}
else if(a==='remove-session-ex'){if(confirm('¿Quitar este ejercicio de la sesión?')){db.activeSession.exercises=db.activeSession.exercises.filter(e=>e.id!==b.dataset.ex);save();render()}}
else if(a==='session-ex-notes'){let e=db.activeSession?.exercises.find(e=>e.id===id);let n=prompt('Notas del ejercicio:',e?.notes||'');if(n!==null){e.notes=n;save()}}
else if(a==='add-session-ex')chooseExercise(ex=>{db.activeSession.exercises.push({...ex,id:uid(),exerciseId:ex.id,sets:Array.from({length:3},()=>({id:uid(),weight:'',reps:'',duration:'',completed:false})),reps:'8–12',metric:'reps',rest:120,exerciseNameSnapshot:ex.name});save();render()})
else if(a==='session-replace-ex')chooseExercise(ex=>{let current=db.activeSession?.exercises.find(x=>x.id===b.dataset.ex);if(!current)return;if(!confirm('¿Sustituir '+current.name+' por '+ex.name+'? Se reiniciarán las series de este ejercicio, pero el resto del entrenamiento se conservará.'))return;let count=Math.max(1,current.sets?.length||3);Object.assign(current,{...ex, id:current.id,exerciseId:ex.id,name:ex.name,exerciseNameSnapshot:ex.name,sets:Array.from({length:count},()=>({id:uid(),weight:'',reps:'',duration:'',distance:'',completed:false})),metric:'reps',reps:'8–12',rest:120,notes:''});save();render()})
else if(a==='finish-session'){let s=db.activeSession;if(s&&confirm('¿Finalizar y guardar este entrenamiento?')){s.status='completed';s.completedAt=now();db.sessions.push(JSON.parse(JSON.stringify(s)));db.activeSession=null;save();page='history';render();offerBackupReminder()}}
else if(a==='timer-toggle'){if(timer.running){timer.remaining=getRemaining();timer.running=false}else{timer.running=true;timer.end=Date.now()+timer.remaining*1000}render()}
else if(a==='timer-reset'){timer.running=false;timer.remaining=90;render()}
else if(a==='timer-add'){timer.remaining=getRemaining()+Number(b.dataset.seconds);if(timer.running)timer.end=Date.now()+timer.remaining*1000;render()}
else if(a==='timer-set'){timer.remaining=Math.max(1,Number($('#timerCustom').value)||90);timer.running=false;render()}
else if(a==='save-settings'){db.settings.unit=$('#unit').value;db.settings.compound=Math.max(1,Number($('#compound').value)||150);db.settings.isolation=Math.max(1,Number($('#isolation').value)||90);db.settings.autoTimer=$('#autoTimer').checked;save();render()}
else if(a==='backup'){download(JSON.stringify({...db,exportedAt:now(),format:'gymlog-backup'},null,2),'gymlog-copia-'+new Date().toISOString().slice(0,10)+'.json','application/json')}
else if(a==='restore')$('#restoreFile').click()
else if(a==='reset'){if(confirm('Esto borrará rutinas, sesiones y ajustes de este navegador. ¿Continuar?')&&confirm('Última confirmación: ¿has guardado una copia?')){localStorage.removeItem('gymlog_db');seed();save();go('home')}}
else if(a==='export-all-routines')download(JSON.stringify({format:'gymlog-routines',version:1,routines:db.routines},null,2),'gymlog-rutinas.json','application/json')
else if(a==='view-session')viewSession(id)
else if(a==='delete-session'){if(confirm('¿Eliminar este entrenamiento del historial?')){db.sessions=db.sessions.filter(s=>s.id!==id);save();render()}}
}
function editRoutine(r){const isNew=!r;let copy=r?JSON.parse(JSON.stringify(r)):{id:uid(),name:'Nueva rutina',days:[{id:uid(),name:'Día 1',exercises:[]}]};const content=`<div class="title">${isNew?'Nueva rutina':'Editar rutina'}</div><div class="card"><label>Nombre</label><input id="rName" value="${esc(copy.name)}"><div id="daysEdit">${copy.days.map((d,i)=>dayEditor(d,i)).join('')}</div><div class="actions"><button class="secondary" id="addDay">＋ Añadir día</button><button id="saveRoutine">Guardar rutina</button><button class="ghost" id="cancelRoutine">Cancelar</button></div></div>`;$('#main').innerHTML=content;let days=copy.days;const redraw=()=>{$('#daysEdit').innerHTML=days.map((d,i)=>dayEditor(d,i)).join('');bindDayControls()};function bindDayControls(){$$('#daysEdit [data-dayname]').forEach(inp=>inp.onchange=()=>days[+inp.dataset.index].name=inp.value);$$('#daysEdit [data-add-ex]').forEach(btn=>btn.onclick=()=>chooseExercise(ex=>{days[+btn.dataset.addEx].exercises.push({id:uid(),exerciseId:ex.id,name:ex.name,variant:'',sets:3,reps:'8–12',rest:120,notes:'',metric:'reps'});redraw()}));$$('#daysEdit [data-del-day]').forEach(btn=>btn.onclick=()=>{if(days.length>1){days.splice(+btn.dataset.delDay,1);redraw()}else alert('La rutina debe tener al menos un día.')});$$('#daysEdit [data-remove-ex]').forEach(btn=>btn.onclick=()=>{days[+btn.dataset.day].exercises.splice(+btn.dataset.removeEx,1);redraw()});$$('#daysEdit [data-exfield]').forEach(inp=>inp.onchange=()=>{let e=days[+inp.dataset.day].exercises[+inp.dataset.ex];e[inp.dataset.exfield]=inp.dataset.exfield==='sets'?Math.max(1,Number(inp.value)||1):inp.value})}function dayEditor(d,i){return `<div class="card"><div class="row between"><input data-dayname data-index="${i}" value="${esc(d.name)}"><button class="danger" data-del-day="${i}">Eliminar día</button></div>${d.exercises.map((e,j)=>`<div class="row between" style="padding:8px 0;border-bottom:1px solid var(--line)"><div style="flex:1"><b>${esc(e.name)}</b><div class="fieldgrid"><div><label>Series</label><input type="number" min="1" data-exfield="sets" data-day="${i}" data-ex="${j}" value="${e.sets}"></div><div><label>Repeticiones objetivo</label><input data-exfield="reps" data-day="${i}" data-ex="${j}" value="${esc(e.reps)}"></div></div></div><button class="ghost" data-day="${i}" data-remove-ex="${j}">Quitar</button></div>`).join('')}<button class="secondary" data-add-ex="${i}">＋ Añadir ejercicio</button></div>`}
$('#addDay').onclick=()=>{days.push({id:uid(),name:'Día '+(days.length+1),exercises:[]});redraw()};$('#saveRoutine').onclick=()=>{copy.name=$('#rName').value.trim()||'Rutina sin nombre';copy.days=days;if(isNew)db.routines.push(copy);else db.routines[db.routines.findIndex(x=>x.id===copy.id)]=copy;save();go('routines');offerBackupReminder()};$('#cancelRoutine').onclick=()=>go('routines');bindDayControls();}
function chooseExercise(callback){const groups=['Todos',...new Set(db.library.map(e=>e.group))];const box=document.createElement('div');box.className='card';box.innerHTML=`<div class="subtitle">Añadir ejercicio</div><button class="secondary" id="customFirst">＋ Otro / Crear ejercicio personalizado</button><label style="margin-top:10px">Buscar</label><input id="pickSearch" placeholder="Nombre del ejercicio"><label>Grupo muscular</label><select id="pickGroup">${groups.map(g=>`<option>${esc(g)}</option>`).join('')}</select><div id="pickList" style="max-height:45vh;overflow:auto;margin-top:10px"></div><button class="ghost" id="pickCancel">Cancelar</button>`;$('#main').prepend(box);function update(){let q=$('#pickSearch').value.toLowerCase(),g=$('#pickGroup').value;$('#pickList').innerHTML=db.library.filter(e=>(g==='Todos'||e.group===g)&&e.name.toLowerCase().includes(q)).slice(0,70).map(e=>`<button class="secondary" style="display:block;width:100%;text-align:left;margin:4px 0" data-pick="${e.id}">${esc(e.name)} <span class="small muted">· ${esc(e.group)}</span></button>`).join('');$$('[data-pick]').forEach(b=>b.onclick=()=>{box.remove();callback(findExercise(b.dataset.pick))})}$('#pickSearch').oninput=update;$('#pickGroup').onchange=update;$('#pickCancel').onclick=()=>box.remove();$('#customFirst').onclick=()=>{box.remove();editExercise(null,callback)};update()}
function editExercise(e,callback){let isNew=!e;$('#main').innerHTML=`<div class="title">${isNew?'Crear ejercicio':'Editar ejercicio'}</div><div class="card"><label>Nombre</label><input id="exName" value="${esc(e?.name||'')}"><div class="fieldgrid"><div><label>Grupo muscular</label><input id="exGroup" list="groups" value="${esc(e?.group||'General y funcional')}"><datalist id="groups">${[...new Set(db.library.map(x=>x.group))].map(g=>`<option>${esc(g)}</option>`).join('')}</datalist></div><div><label>Subgrupo</label><input id="exSub" value="${esc(e?.subgroup||'General')}"></div><div><label>Equipamiento</label><input id="exEquipment" value="${esc(e?.equipment||'Máquina')}"></div><div><label>Variante/máquina (opcional)</label><input id="exVariant" value="${esc(e?.variant||'')}"></div></div><div class="actions"><button id="saveEx">Guardar ejercicio</button><button class="ghost" id="cancelEx">Cancelar</button></div></div>`;$('#saveEx').onclick=()=>{let name=$('#exName').value.trim();if(!name){alert('Escribe el nombre del ejercicio.');return}let obj={...(e||exercise(name,$('#exGroup').value,$('#exSub').value,$('#exEquipment').value)),name,group:$('#exGroup').value||'General y funcional',subgroup:$('#exSub').value||'General',equipment:$('#exEquipment').value||'Otro',variant:$('#exVariant').value,isCustom:true};if(isNew)db.library.push(obj);else db.library[db.library.findIndex(x=>x.id===e.id)]=obj;save();if(callback)callback(obj);else go('library')};$('#cancelEx').onclick=()=>go('library')}
function importText(){
 const html=`<div class="title">Crear rutina desde texto</div><div class="card"><p class="muted small">Primero indica el nombre y cuántos días entrenas. Después pega el texto completo. La aplicación usará esos datos para organizar la rutina y podrás corregir la distribución antes de guardarla.</p><div class="fieldgrid"><div><label for="importRoutineName">Nombre de la rutina</label><input id="importRoutineName" placeholder="Ej. Hipertrofia 4 días" value="Rutina importada"></div><div><label for="importDayCount">Días de entrenamiento</label><select id="importDayCount">${[1,2,3,4,5,6,7].map(n=>`<option value="${n}" ${n===4?'selected':''}>${n} ${n===1?'día':'días'}</option>`).join('')}</select></div></div><label for="importSource" style="margin-top:12px">Texto del entrenamiento</label><textarea id="importSource" rows="12" placeholder="Día 1: Pecho y tríceps&#10;Press de pecho en máquina 3 × 10&#10;Aperturas en polea 3 × 12&#10;&#10;Día 2: Espalda y bíceps&#10;Jalón al pecho 4 × 10"></textarea><div class="actions"><button id="parseText">Analizar y organizar</button><button class="ghost" data-go="routines">Cancelar</button></div></div><div id="importPreview"></div>`;
 $('#main').innerHTML=html;
 $('#parseText').onclick=()=>{
  const source=$('#importSource').value.trim(); if(!source){alert('Pega el texto del entrenamiento antes de continuar.');return}
  const routineName=$('#importRoutineName').value.trim()||'Rutina importada';
  const requestedDays=Math.max(1,Math.min(7,Number($('#importDayCount').value)||4));
  const lines=source.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  const parsed=[]; const headers=[]; let currentHeader=null;
  const exercisePattern=/^\s*(?:[-•*]\s*)?(.+?)\s+(\d+)\s*[x×]\s*(\d+(?:\s*[-–]\s*\d+)?(?:\s*(?:s|seg|segundos|min|por\s+lado))?)(?:\s*.*)?$/i;
  const dayHeader=/^(?:día|dia|day)\s*(\d+)?\s*[:.\-–—]?\s*(.*)$/i;
  const weekdayMap={'lunes':0,'martes':1,'miércoles':2,'miercoles':2,'jueves':3,'viernes':4,'sábado':5,'sabado':5,'domingo':6};
  for(const line of lines){
   let m=line.match(exercisePattern);
   if(m){const raw=m[1].replace(/[-•*]\s*$/,'').trim(); if(!raw)continue; const normalized=raw.toLowerCase(); const found=db.library.find(e=>e.name.toLowerCase()===normalized)||db.library.find(e=>e.name.toLowerCase().includes(normalized)||normalized.includes(e.name.toLowerCase())); parsed.push({id:uid(),exerciseId:found?.id||raw,name:found?.name||raw,variant:'',sets:Number(m[2]),reps:m[3].replace(/\s+/g,' ').trim(),rest:120,notes:found?'':'Revisar ejercicio importado',metric:/s|seg|min/i.test(m[3])?'duration':'reps',needsReview:!found,sourceHeader:currentHeader,dayIndex:null});
   }else{
    // Las líneas que no contienen series x repeticiones se interpretan como encabezados de día/bloque.
    let h=line.match(dayHeader); let index=null; let label=line.replace(/[:：]$/,'').trim();
    if(h && h[1])index=Math.max(0,Number(h[1])-1);
    else {const first=line.toLowerCase().match(/^(lunes|martes|miércoles|miercoles|jueves|viernes|sábado|sabado|domingo)\b/);if(first)index=weekdayMap[first[1]];}
    currentHeader={label,index,sequence:headers.length}; headers.push(currentHeader);
   }
  }
  if(!parsed.length){alert('No he detectado ejercicios con un formato de series y repeticiones reconocible. Prueba con líneas como «Jalón al pecho 4 × 10».');return}
  const days=Array.from({length:requestedDays},(_,i)=>({id:uid(),name:`Día ${i+1}`,exercises:[]}));
  // Si hay encabezados entre ejercicios, respetarlos. Si no hay encabezados claros, repartir en bloques equilibrados.
  const hasExplicitStructure=parsed.some(e=>e.sourceHeader!==null);
  if(hasExplicitStructure){
   const usedHeaders=[...new Set(parsed.map(e=>e.sourceHeader).filter(Boolean))];
   const headerToDay=new Map(); let next=0;
   for(const h of usedHeaders){let idx=Number.isInteger(h.index)?h.index:next;idx=Math.min(requestedDays-1,Math.max(0,idx));if(headerToDay.has(h)&&!Number.isInteger(h.index))idx=next;headerToDay.set(h,idx);if(h.label)days[idx].name=h.label;next=Math.min(requestedDays-1,idx+1)}
   parsed.forEach((e,i)=>{let idx=e.sourceHeader?headerToDay.get(e.sourceHeader):Math.min(requestedDays-1,Math.floor(i*requestedDays/parsed.length));e.dayIndex=Number.isInteger(idx)?idx:0;days[e.dayIndex].exercises.push(e)});
  }else{
   parsed.forEach((e,i)=>{const idx=Math.min(requestedDays-1,Math.floor(i*requestedDays/parsed.length));e.dayIndex=idx;days[idx].exercises.push(e)});
  }
  // Completar nombres de días cuando los encabezados no proporcionan uno útil y eliminar los bloques vacíos innecesarios solo si el usuario eligió menos días.
  days.forEach((d,i)=>{if(!d.name||/^Día \d+$/.test(d.name))d.name=`Día ${i+1}`});
  let routine={id:uid(),name:routineName,days}; window.importCandidate=routine;
  const syncPreview=()=>{routine.name=$('#previewName')?.value.trim()||routine.name;routine.days.forEach((d,di)=>d.exercises.forEach((e,ei)=>{const n=$(`[data-prev-name="${di}-${ei}"]`),sets=$(`[data-prev-sets="${di}-${ei}"]`),reps=$(`[data-prev-reps="${di}-${ei}"]`);if(n)e.name=n.value.trim()||'Ejercicio';if(sets)e.sets=Math.max(1,Number(sets.value)||1);if(reps)e.reps=reps.value}))};
  const renderPreview=()=>{
   $('#importPreview').innerHTML=`<div class="card"><div class="subtitle">Revisar y organizar antes de guardar</div><p class="muted small">Usa «Mover a otro día» en cada ejercicio si la detección no lo ha colocado correctamente. Puedes cambiar los nombres de los días y eliminar ejercicios que no quieras importar.</p><label>Nombre de rutina</label><input id="previewName" value="${esc(routine.name)}">${routine.days.map((d,di)=>`<div class="card" style="margin-top:12px"><div class="row between"><input data-prev-dayname="${di}" value="${esc(d.name)}" aria-label="Nombre del día ${di+1}"><span class="pill">${d.exercises.length} ejercicios</span></div>${d.exercises.map((e,ei)=>`<div class="exercise"><div class="row between"><div style="flex:1"><input data-prev-name="${di}-${ei}" value="${esc(e.name)}"><div class="fieldgrid"><div><label>Series</label><input type="number" min="1" data-prev-sets="${di}-${ei}" value="${e.sets}"></div><div><label>Repeticiones/tiempo</label><input data-prev-reps="${di}-${ei}" value="${esc(e.reps)}"></div></div>${e.needsReview?'<span class="pill">Revisar ejercicio</span>':''}</div><button class="ghost" data-prev-del="${e.id}">Quitar</button></div><label style="margin-top:8px">Mover a otro día</label><select data-prev-move="${e.id}">${routine.days.map((dest,di2)=>`<option value="${di2}" ${di2===di?'selected':''}>${esc(dest.name)}</option>`).join('')}</select></div>`).join('')||'<p class="muted small">No hay ejercicios en este día todavía.</p>'}</div>`).join('')}<div class="actions"><button id="saveImported">Guardar rutina</button><button class="secondary" id="backImported">Volver al texto</button><button class="ghost" id="cancelImported">Cancelar</button></div></div>`;
   $$('[data-prev-dayname]').forEach(inp=>inp.onchange=()=>{routine.days[Number(inp.dataset.prevDayname)].name=inp.value.trim()||`Día ${Number(inp.dataset.prevDayname)+1}`;renderPreview()});
   $$('[data-prev-move]').forEach(sel=>sel.onchange=()=>{syncPreview();const exId=sel.dataset.prevMove;let from=-1,exerciseObj=null;routine.days.forEach((d,di)=>{const ei=d.exercises.findIndex(e=>e.id===exId);if(ei>=0){from=di;exerciseObj=d.exercises.splice(ei,1)[0]}});const to=Number(sel.value);if(exerciseObj&&from!==to)routine.days[to].exercises.push(exerciseObj);else if(exerciseObj)routine.days[from].exercises.push(exerciseObj);renderPreview()});
   $$('[data-prev-del]').forEach(btn=>btn.onclick=()=>{syncPreview();routine.days.forEach(d=>d.exercises=d.exercises.filter(e=>e.id!==btn.dataset.prevDel));renderPreview()});
   $('#saveImported').onclick=()=>{syncPreview();routine.name=$('#previewName').value.trim()||'Rutina importada';routine.days.forEach((d,di)=>{const inp=$(`[data-prev-dayname="${di}"]`);if(inp)d.name=inp.value.trim()||`Día ${di+1}`;d.exercises.forEach(e=>{const found=db.library.find(x=>x.name.toLowerCase()===e.name.toLowerCase());if(found)e.exerciseId=found.id;else{let custom=exercise(e.name,'General y funcional','General','Otro');custom.isCustom=true;db.library.push(custom);e.exerciseId=custom.id}delete e.needsReview;delete e.sourceHeader;delete e.dayIndex})});db.routines.push(routine);save();go('routines');offerBackupReminder()};
   $('#backImported').onclick=()=>{syncPreview();$('#importPreview').innerHTML='';$('#importSource').focus()};$('#cancelImported').onclick=()=>go('routines');
  };
  renderPreview();
 };
}
function copyAppLink(){
 const url='https://jmrb92.github.io/GYMLOG/?utm_source=chatgpt.com';
 // Abrir siempre una interfaz visible; no depender de que el navegador permita copiar en segundo plano.
 document.getElementById('shareGymModal')?.remove();
 const wrap=document.createElement('div');wrap.id='shareGymModal';wrap.style.cssText='position:fixed;inset:0;background:#17212699;z-index:9999;display:flex;align-items:center;justify-content:center;padding:18px';
 wrap.innerHTML=`<div role="dialog" aria-modal="true" aria-labelledby="shareGymTitle" class="card" style="max-width:480px;width:100%;box-shadow:0 12px 40px #0004"><div class="row between"><div class="subtitle" id="shareGymTitle">Compartir GYM LOG</div><button type="button" class="ghost" id="shareGymClose" aria-label="Cerrar">✕</button></div><p>Comparte este enlace con tu amigo:</p><input id="shareGymUrl" type="text" readonly value="${url}" style="margin:4px 0 10px"><div id="shareGymStatus" class="small muted" role="status" style="margin:5px 0 10px">Pulsa «Copiar enlace» o selecciona y copia la dirección.</div><div class="actions"><button type="button" id="shareGymCopy">Copiar enlace</button><button type="button" class="secondary" id="shareGymNative">Compartir…</button><button type="button" class="ghost" id="shareGymSelect">Seleccionar enlace</button></div></div>`;
 document.body.appendChild(wrap);
 const field=wrap.querySelector('#shareGymUrl'),status=wrap.querySelector('#shareGymStatus'),close=()=>wrap.remove();
 wrap.querySelector('#shareGymClose').onclick=close;wrap.onclick=e=>{if(e.target===wrap)close()};
 wrap.querySelector('#shareGymSelect').onclick=()=>{field.focus();field.select();status.textContent='Enlace seleccionado. Usa Ctrl+C (o Mantén pulsado y Copiar en el móvil).'};
 wrap.querySelector('#shareGymCopy').onclick=async()=>{let copied=false;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(url);copied=true}}catch(e){}if(!copied){try{field.focus();field.select();copied=document.execCommand('copy')}catch(e){copied=false}}status.textContent=copied?'Enlace copiado. Ya puedes pegarlo y enviarlo.':'El navegador no permitió copiar automáticamente. El enlace está seleccionado; cópialo manualmente.';if(!copied){field.focus();field.select()}};
 wrap.querySelector('#shareGymNative').onclick=async()=>{try{if(navigator.share){await navigator.share({title:'GYM LOG',text:'Prueba GYM LOG para organizar tus entrenamientos:',url});status.textContent='Se ha abierto el menú para compartir.'}else{field.focus();field.select();status.textContent='Este navegador no ofrece el menú de compartir. Copia el enlace seleccionado.'}}catch(e){if(e?.name!=='AbortError')status.textContent='No se pudo abrir el menú de compartir. Puedes copiar el enlace manualmente.'}};
 field.focus();field.select();
}
async function shareRoutine(r){const data=JSON.stringify({format:'gymlog-routine',version:1,routine:r},null,2);const filename=`${safeName(r.name)}.gymlog`;try{const file=new File([data],filename,{type:'application/json'});if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({title:`Rutina ${r.name} · GYM LOG`,text:'Te comparto esta rutina para importarla en GYM LOG.',files:[file]});return}}catch(e){if(e?.name==='AbortError')return}download(data,filename,'application/json');alert('Se ha exportado únicamente esta rutina. Envíale el archivo .gymlog a tu amigo; podrá importarlo sin compartir tus otras rutinas ni tu historial.')}

function viewSession(id){let s=db.sessions.find(s=>s.id===id);if(!s)return;$('#main').innerHTML=`<div class="title">${esc(s.routineNameSnapshot)} · ${esc(s.dayNameSnapshot)}</div><div class="card"><div class="muted">${new Date(s.completedAt).toLocaleString('es-ES',{dateStyle:'full',timeStyle:'short'})}</div>${s.exercises.map(e=>`<div class="exercise"><b>${esc(e.exerciseNameSnapshot)}</b><div class="small muted">${esc(e.variant||'')}</div>${e.sets.map((x,i)=>`<div class="row between small" style="padding:4px 0"><span>Serie ${i+1}</span><span>${x.weight!==''?esc(x.weight)+' '+db.settings.unit+' × ':''}${esc(x.reps||x.duration||'—')} ${x.completed?'✓':'—'}</span></div>`).join('')}${e.notes?`<p class="small muted">${esc(e.notes)}</p>`:''}</div>`).join('')}<button class="secondary" data-go="history">Volver al historial</button></div>`;bind()}
function dayNameFromRoutine(r){return r.days[0]?.id||''}
function offerBackupReminder(){const pref=db.settings?.backupReminder||{mode:'ask',until:0};if(pref.mode==='never'||(pref.mode==='snooze'&&Date.now()<Number(pref.until||0)))return;if($('#backupReminderModal'))return;const wrap=document.createElement('div');wrap.id='backupReminderModal';wrap.style.cssText='position:fixed;inset:0;background:#17212688;z-index:100;display:flex;align-items:center;justify-content:center;padding:18px';wrap.innerHTML=`<div class="card" style="max-width:440px;width:100%;box-shadow:0 12px 40px #0003"><div class="subtitle">¿Hacemos una copia de seguridad?</div><p>Has guardado cambios importantes. Descarga un archivo en tu dispositivo para poder recuperar tus rutinas y entrenamientos si borras los datos del navegador o cambias de móvil.</p><div class="actions"><button id="backupReminderNow">Descargar copia ahora</button><button class="secondary" id="backupReminderWeek">No recordar esta semana</button><button class="ghost" id="backupReminderNever">No recordar nunca</button><button class="ghost" id="backupReminderClose">Ahora no</button></div></div>`;document.body.appendChild(wrap);const close=()=>wrap.remove();$('#backupReminderNow').onclick=()=>{download(JSON.stringify({...db,exportedAt:now(),format:'gymlog-backup'},null,2),'gymlog-copia-'+new Date().toISOString().slice(0,10)+'.json','application/json');close()};$('#backupReminderWeek').onclick=()=>{db.settings.backupReminder={mode:'snooze',until:Date.now()+7*864e5};save();close()};$('#backupReminderNever').onclick=()=>{db.settings.backupReminder={mode:'never',until:0};save();close()};$('#backupReminderClose').onclick=close;wrap.onclick=e=>{if(e.target===wrap)close()}}
function download(content,name,type){let blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function safeName(s){return String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'rutina'}
function restoreFile(ev){const f=ev.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{try{const obj=JSON.parse(reader.result);if(obj.format==='gymlog-routine'&&obj.routine){let r=obj.routine;if(db.routines.some(x=>x.name===r.name))r.name+=' (importada)';r.id=uid();r.days.forEach(d=>{d.id=uid();d.exercises.forEach(e=>e.id=uid())});db.routines.push(r)}else if(obj.format==='gymlog-backup'&&obj.library&&obj.routines&&obj.sessions){if(!confirm('¿Fusionar la copia con los datos actuales? Aceptar = fusionar, Cancelar = reemplazar.')){if(!confirm('¿Seguro que quieres reemplazar todos los datos actuales?'))return;db=obj;delete db.exportedAt}else{const existing=new Set(db.routines.map(r=>r.name));obj.routines.forEach(r=>{if(!existing.has(r.name)){db.routines.push(r);existing.add(r.name)}});const ids=new Set(db.sessions.map(s=>s.id));db.sessions.push(...obj.sessions.filter(s=>!ids.has(s.id)));const exids=new Set(db.library.map(e=>e.id));db.library.push(...obj.library.filter(e=>!exids.has(e.id)))}}else if(obj.format==='gymlog-routines'&&obj.routines){obj.routines.forEach(r=>{if(db.routines.some(x=>x.name===r.name))r.name+=' (importada)';r.id=uid();db.routines.push(r)})}else throw Error('Formato no reconocido');save();alert('Importación completada.');go('home')}catch(e){alert('No se pudo importar el archivo: '+e.message)}ev.target.value=''};reader.readAsText(f)}
function getRemaining(){return timer.running?Math.max(0,(timer.end-Date.now())/1000):timer.remaining}
function formatTime(sec){sec=Math.max(0,Math.ceil(sec));return `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`}
function tick(){if(timer.running){timer.remaining=getRemaining();if(timer.remaining<=0){timer.running=false;timer.remaining=0;try{if(navigator.vibrate)navigator.vibrate([250,120,250])}catch(e){}if(page==='timer')render();else{const btn=$('[data-action="open-timer"]');if(btn)btn.textContent='⏱ Descanso terminado'}}else if(page==='timer'){let d=$('#timerDigits');if(d)d.textContent=formatTime(timer.remaining);let sub=$('#topSub');if(sub)sub.textContent='Descanso: '+formatTime(timer.remaining)}}}
function editUnused(){}
$('#quickResume').onclick=()=>{page='workout';render()};document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});load();save();render();setInterval(tick,250);
})();
