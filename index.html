const TEMPLATE_NAMES=['Full Body de 2 días','Push Pull Legs de 3 días','Hipertrofia de 5 días','Rutina híbrida de 5 días'];
function ensureDefaultTemplates(){
 const present=new Set(db.routines.filter(r=>r.isTemplate).map(r=>r.name));
 if(TEMPLATE_NAMES.every(n=>present.has(n)))return;
 const current=db;
 seed();
 const defaults=db;
 db=current;
 const normalizeName=s=>String(s||'').trim().toLocaleLowerCase('es');
 for(const source of defaults.library){
  let target=db.library.find(e=>normalizeName(e.name)===normalizeName(source.name));
  if(!target){target={...source,id:uid()};db.library.push(target)}
 }
 for(const source of defaults.routines.filter(r=>r.isTemplate&&!present.has(r.name))){
  const r=JSON.parse(JSON.stringify(source));r.id=uid();r.active=false;r.isTemplate=true;r.createdAt=now();
  r.days.forEach(d=>{d.id=uid();d.exercises.forEach(e=>{e.id=uid();let match=db.library.find(x=>normalizeName(x.name)===normalizeName(e.name));if(!match){match={...exercise(e.name,'General y funcional','General','Otro'),isCustom:true};db.library.push(match)}e.exerciseId=match.id})});
  db.routines.push(r);
 }
}

function normalizeDatabase({legacyActiveFallback=false}={}){
 if(!Array.isArray(db.library))db.library=[];
 if(!Array.isArray(db.routines))db.routines=[];
 if(!Array.isArray(db.sessions))db.sessions=[];
 db.settings={unit:'kg',autoTimer:true,compound:120,isolation:120,backupReminder:{mode:'ask',until:0},...(db.settings||{})};
 if(!db.settings.backupReminder)db.settings.backupReminder={mode:'ask',until:0};if(!db.settings.timerDefaultsV110){if(Number(db.settings.compound)===150)db.settings.compound=120;if(Number(db.settings.isolation)===90)db.settings.isolation=120;db.settings.timerDefaultsV110=true;}
 db.routines.forEach(r=>{if(typeof r.isTemplate!=='boolean')r.isTemplate=TEMPLATE_NAMES.includes(r.name);if(typeof r.active!=='boolean')r.active=false;if(!Array.isArray(r.days))r.days=[];r.days.forEach(d=>{if(!d.id)d.id=uid();if(!Array.isArray(d.exercises))d.exercises=[]})});
 ensureDefaultTemplates();
 ensureDobleTemplates();
 if(db.activeSession===undefined)db.activeSession=null;
 if(legacyActiveFallback&&!db.routines.some(r=>r.active)){const preferred=db.routines.find(r=>r.id===db.lastRoutine)||db.routines.find(r=>r.name==='Rutina híbrida de 5 días')||db.routines.find(r=>!r.isTemplate)||db.routines[0];if(preferred)preferred.active=true;}
}
function load(){
 let parsed=null;
 try{parsed=JSON.parse(readStored('gymlog_db'))}catch(e){}
 if(!parsed||!Array.isArray(parsed.routines)||!Array.isArray(parsed.library)){seed();normalizeDatabase();save();return}
 db=parsed;
 const legacyActiveFallback=!db.routines.some(r=>typeof r.active==='boolean');
 normalizeDatabase({legacyActiveFallback});
 save();
}

function startSession(routine,day){
 if(!routine||!Array.isArray(routine.days)){alert('No se encuentra la rutina. Vuelve a Mis rutinas y selecciona una rutina válida.');go('routines');return}
 const d=routine.days.find(x=>x.id===day);if(!d){alert('No se encuentra el día seleccionado. Abre la rutina y vuelve a elegirlo.');go('routines');return}
 if(!window._adConfirmed){window._pendingStart={routineId:routine.id,dayId:day};showStartAd(()=>{const p=window._pendingStart;window._pendingStart=null;window._adConfirmed=true;startSession(findRoutine(p.routineId),p.dayId);window._adConfirmed=false});return}
 if(db.activeSession&&db.activeSession.status==='active'){if(!confirm('Ya hay un entrenamiento sin terminar. ¿Descartarlo y empezar otro?'))return}
 const previousSession=db.activeSession;
 const session={id:uid(),routineId:routine.id,routineNameSnapshot:routine.name,dayId:d.id,dayNameSnapshot:'Día '+(routine.days.indexOf(d)+1),startedAt:now(),status:'active',exercises:(Array.isArray(d.exercises)?d.exercises:[]).map(e=>{const prev=latestFor(e);const count=Math.max(1,Math.min(30,Math.floor(Number(e.sets)||3)));let sets=[];for(let i=0;i<count;i++){let p=prev?.sets?.[i];sets.push({id:uid(),weight:p?.weight??'',reps:p?.reps??'',duration:p?.duration??'',distance:p?.distance??'',completed:false})}return {...JSON.parse(JSON.stringify(e)),sets,exerciseNameSnapshot:e.name||'Ejercicio'}})};
 db.activeSession=session;db.lastRoutine=routine.id;db.lastDay=d.id;activeDay=d.id;

}

function calendarWeeks(){
 const today=new Date();today.setHours(0,0,0,0);const monday=new Date(today);monday.setDate(today.getDate()-((today.getDay()+6)%7));const first=new Date(monday);first.setDate(first.getDate()-11*7);
 const byDate=new Map();(db.sessions||[]).filter(s=>s.status==='completed'&&s.completedAt).forEach(s=>{const d=new Date(s.completedAt);const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;if(!byDate.has(key))byDate.set(key,[]);byDate.get(key).push(s)});
 const weeks=[];for(let w=0;w<12;w++){const days=[];const weekStart=new Date(first);weekStart.setDate(first.getDate()+w*7);const monthLabel=weekStart.toLocaleDateString('es-ES',{month:'short'}).replace('.','');for(let i=0;i<7;i++){const d=new Date(weekStart);d.setDate(weekStart.getDate()+i);const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const isToday=d.getTime()===today.getTime();const future=d>today;const sessions=byDate.get(key)||[];const title=`${d.toLocaleDateString('es-ES',{dateStyle:'full'})}${sessions.length?' · '+sessions.length+' entrenamiento(s) registrado(s)':' · Sin entrenamiento registrado'}`;days.push(`<button type="button" class="calendar-day ${sessions.length?'trained':''} ${isToday?'today':''} ${future?'future':''}" data-calendar-date="${key}" title="${esc(title)}" aria-label="${esc(title)}" ${future?'disabled':''}>${d.getDate()}</button>`)}weeks.push(`<div class="calendar-week"><div class="calendar-month">${esc(monthLabel)}</div>${days.join('')}</div>`)}return weeks.join('')
}
function openCalendarDate(dateKey){const matches=(db.sessions||[]).filter(s=>s.status==='completed'&&s.completedAt&&(()=>{const d=new Date(s.completedAt);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`===dateKey})()).sort((a,b)=>b.completedAt.localeCompare(a.completedAt));if(!matches.length){alert('No hay ningún entrenamiento registrado ese día.');return}if(matches.length===1){viewSession(matches[0].id);return}$('#main').innerHTML=`<div class="title">Entrenamientos del ${new Date(dateKey+'T12:00:00').toLocaleDateString('es-ES',{dateStyle:'full'})}</div>${matches.map(s=>`<div class="card"><b>${esc(s.routineNameSnapshot)} · ${esc(s.dayNameSnapshot)}</b><p class="small muted">${new Date(s.completedAt).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})}</p><button data-action="view-session" data-id="${s.id}">Ver entrenamiento</button></div>`).join('')}<button class="secondary" data-go="home">Volver al calendario</button>`;bind()}

function matchReference(name,refs){const norm=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\b(machine|maquina|asistida|asistido|polea|barra|mancuerna|discos|agarre|superior|inferior|abierto|recta|sentado|tumbado|frontal)\b/g,' ').replace(/\s+/g,' ').trim();const n=norm(name);let best=null,score=0;for(const r of refs){const cand=[r.name,...(r.aliases||[])].map(norm);let sc=0;for(const c of cand){if(!c)continue;if(c===n)sc=Math.max(sc,100);else if(n.includes(c)||c.includes(n))sc=Math.max(sc,75*Math.min(c.length,n.length)/Math.max(c.length,n.length));const a=new Set(n.split(' ')),b=new Set(c.split(' '));const overlap=[...a].filter(t=>b.has(t)&&t.length>2).length;sc=Math.max(sc,overlap/Math.max(1,a.size)*65)}if(sc>score){score=sc;best=r}}return score>=20?best:null}

;close();render()})};$('#replaceSearch').oninput=update;update();$('#replaceSearch').focus()}
function action(b){const a=b.dataset.action,id=b.dataset.id;
if(a==='resume'){page='workout';render()}
else if(a==='discard-session'){if(confirm('¿Descartar la sesión sin terminar?')){db.activeSession=null;save();render()}}
else if(a==='view-template'){viewTemplate(findRoutine(id))}
else if(a==='choose-start'){const r=findRoutine(id);if(r){window.chooseRoutine=id;$('#main').innerHTML=chooseDayView(r);bind()}}
else if(a==='start-day'){const routine=findRoutine(b.dataset.routine);if(!routine){alert('No se encuentra la rutina seleccionada.');go('routines');return}startSession(routine,b.dataset.day)}
else if(a==='new-routine')importText()
else if(a==='manual-routine')editRoutine(null)
else if(a==='routine-edit'){const r=findRoutine(id);if(r&&!r.isTemplate)editRoutine(r);else if(r?.isTemplate)alert('Las rutinas de serie están protegidas. Duplica la rutina para editar la copia.')}
else if(a==='duplicate-routine'){let r=findRoutine(id);if(r){let c=JSON.parse(JSON.stringify(r));c.id=uid();c.name+=' (copia)';c.isTemplate=false;c.active=true;c.createdAt=now();c.days.forEach(d=>{d.id=uid();d.exercises.forEach(e=>e.id=uid())});db.routines.push(c);save();render();offerBackupReminder()}}
else if(a==='toggle-active'){let r=findRoutine(id);if(r){r.active=!r.active;save();render()}}
else if(a==='delete-routine'){const r=findRoutine(id);if(r?.isTemplate){alert('Las rutinas de serie no se pueden eliminar. Puedes desactivarlas en Inicio o duplicarlas.')}else if(r&&confirm('¿Eliminar la rutina? El historial se conservará.')){db.routines=db.routines.filter(r=>r.id!==id);save();render()}}
else if(a==='export-routine'){let r=findRoutine(id);if(r)download(JSON.stringify({format:'gymlog-routine',version:1,routine:r},null,2),`${safeName(r.name)}.gymlog`,'application/json')}
else if(a==='share-routine'){let r=findRoutine(id);if(r)shareRoutine(r)}
else if(a==='share-link')copyAppLink()
else if(a==='import-text')importText()
else if(a==='new-exercise')editExercise(null)
else if(a==='edit-exercise')editExercise(findExercise(id))
else if(a==='show-routine'){page='workout';render();window.scrollTo(0,0)}
else if(a==='save-exit-session'){if(save()){page='home';render();window.scrollTo(0,0)}}
else if(a==='open-timer'){timer.open=true;page='timer';render()}
else if(a==='back-workout'){page=db.activeSession?'workout':'home';render()}
else if(a==='toggle-set'){let s=db.activeSession,e=s?.exercises.find(e=>e.id===b.dataset.ex),set=e?.sets[Number(b.dataset.index)];if(set){set.completed=!set.completed;if(set.completed&&db.settings.autoTimer){timer.remaining=e.rest||120;timer.running=true;timer.end=Date.now()+timer.remaining*1000}save();render()}}
else if(a==='add-set'||a==='remove-set'){let e=db.activeSession?.exercises.find(e=>e.id===b.dataset.ex);if(e){if(a==='add-set')e.sets.push({id:uid(),weight:'',reps:'',duration:'',completed:false});else if(e.sets.length>1)e.sets.pop();save();render()}}
else if(a==='move-session-ex'){const arr=db.activeSession?.exercises||[],i=arr.findIndex(x=>x.id===b.dataset.ex),j=i+Number(b.dataset.dir||0);if(i>=0&&j>=0&&j<arr.length){[arr[i],arr[j]]=[arr[j],arr[i]];const r=findRoutine(db.activeSession.routineId),d=r?.days.find(x=>x.id===db.activeSession.dayId);if(d){const order=new Map(arr.map((x,k)=>[x.id,k]));d.exercises.sort((x,y)=>(order.get(x.id)??999)-(order.get(y.id)??999))}save();render()}}
else if(a==='remove-session-ex'){if(confirm('¿Quitar este ejercicio de la sesión?')){db.activeSession.exercises=db.activeSession.exercises.filter(e=>e.id!==b.dataset.ex);save();render()}}
else if(a==='session-ex-notes'){let e=db.activeSession?.exercises.find(e=>e.id===id);let n=prompt('Notas del ejercicio:',e?.notes||'');if(n!==null){e.notes=n;save()}}
else if(a==='add-session-ex')chooseExercise(ex=>{db.activeSession.exercises.push({...ex,id:uid(),exerciseId:ex.id,sets:Array.from({length:3},()=>({id:uid(),weight:'',reps:'',duration:'',completed:false})),reps:'8–12',metric:'reps',rest:120,exerciseNameSnapshot:ex.name});save();render()})
else if(a==='session-replace-ex'){openSessionReplaceModal(b.dataset.ex)}
else if(a==='finish-session'){let s=db.activeSession;if(s&&confirm('¿Finalizar y guardar este entrenamiento?')){const previousCompletedAt=s.completedAt;const previousStatus=s.status;s.status='completed';s.completedAt=now();db.sessions.push(JSON.parse(JSON.stringify(s)));db.activeSession=null;if(save()){page='history';render();offerBackupReminder()}else{db.sessions.pop();db.activeSession=s;s.status=previousStatus;if(previousCompletedAt===undefined)delete s.completedAt;else s.completedAt=previousCompletedAt}}}
else if(a==='timer-toggle'){if(timer.running){timer.remaining=getRemaining();timer.running=false}else{timer.running=true;timer.end=Date.now()+timer.remaining*1000}render()}
else if(a==='timer-reset'){timer.running=false;timer.remaining=120;render()}
else if(a==='timer-add'){timer.remaining=getRemaining()+Number(b.dataset.seconds);if(timer.running)timer.end=Date.now()+timer.remaining*1000;render()}
else if(a==='timer-set'){timer.remaining=Math.max(1,Number($('#timerCustom').value)||120);timer.running=false;render()}
else if(a==='save-settings'){db.settings.unit=$('#unit').value;db.settings.compound=Math.max(1,Number($('#compound').value)||150);db.settings.isolation=Math.max(1,Number($('#isolation').value)||90);db.settings.autoTimer=$('#autoTimer').checked;save();render()}
else if(a==='pro-apply'){if($('#proPassword').value===(window.GYMLOG_PRO_PASSWORD||'12345678')){writeStored('gymlog_pro_active','1');writeStored('gymlog_pro_signature',proPasswordSignature(window.GYMLOG_PRO_PASSWORD||'12345678'));alert('GYM LOG PRO activado en este dispositivo.');render()}else alert('Contraseña incorrecta.')}
else if(a==='pro-clear'){removeStored('gymlog_pro_active');removeStored('gymlog_pro_signature');alert('GYM LOG PRO desactivado.');render()}
else if(a==='show-privacy'){showPrivacyNotice(true)}
else if(a==='backup'){download(JSON.stringify({...db,exportedAt:now(),format:'gymlog-backup'},null,2),'gymlog-copia-'+new Date().toISOString().slice(0,10)+'.json','application/json')}
else if(a==='restore')$('#restoreFile').click()
else if(a==='reset'){if(confirm('Esto borrará rutinas, sesiones y ajustes de este navegador. ¿Continuar?')&&confirm('Última confirmación: ¿has guardado una copia?')){removeStored('gymlog_db');seed();save();go('home')}}
else if(a==='export-all-routines')download(JSON.stringify({format:'gymlog-routines',version:1,routines:db.routines},null,2),'gymlog-rutinas.json','application/json')
else if(a==='view-session')viewSession(id)
else if(a==='delete-session'){if(confirm('¿Eliminar este entrenamiento del historial?')){db.sessions=db.sessions.filter(s=>s.id!==id);save();render()}}
}
function editRoutine(r){if(r?.isTemplate){alert('Las rutinas de serie están protegidas. Duplica la rutina para editar la copia.');return}const isNew=!r;let copy=r?JSON.parse(JSON.stringify(r)):{id:uid(),name:'Nueva rutina',days:[{id:uid(),name:'Día 1',exercises:[]}]};const content=`<div class="title">${isNew?'Nueva rutina':'Editar rutina'}</div><div class="card"><label>Nombre</label><input id="rName" value="${esc(copy.name)}"><div id="daysEdit">${copy.days.map((d,i)=>dayEditor(d,i)).join('')}</div><div class="actions"><button type="button" class="secondary" id="addDay">＋ Añadir día</button><button type="button" id="saveRoutine">Guardar rutina</button><button type="button" class="ghost" id="cancelRoutine">Cancelar</button></div></div>`;$('#main').innerHTML=content;let days=copy.days;
 const redraw=()=>{$('#daysEdit').innerHTML=days.map((d,i)=>dayEditor(d,i)).join('');bindDayControls()};
 function bindDayControls(){$$('#daysEdit [data-dayname]').forEach(inp=>inp.onchange=()=>days[+inp.dataset.index].name=inp.value);$$('#daysEdit [data-add-ex]').forEach(btn=>btn.onclick=()=>chooseExercise(ex=>{days[+btn.dataset.addEx].exercises.push({id:uid(),exerciseId:ex.id,name:ex.name,referenceExerciseId:ex.referenceExerciseId||'',referenceVideoUrl:ex.referenceVideoUrl||'',variant:ex.variant||'',sets:3,reps:'8–12',rest:120,notes:'',metric:'reps'});redraw()}));$$('#daysEdit [data-del-day]').forEach(btn=>btn.onclick=()=>{if(days.length>1){days.splice(+btn.dataset.delDay,1);redraw()}else alert('La rutina debe tener al menos un día.')});$$('#daysEdit [data-edit-ex]').forEach(btn=>btn.onclick=()=>openRoutineExerciseEditor(+btn.dataset.day,+btn.dataset.editEx));$$('#daysEdit [data-remove-ex]').forEach(btn=>btn.onclick=()=>{days[+btn.dataset.day].exercises.splice(+btn.dataset.removeEx,1);redraw()})}
 function dayEditor(d,i){return `<div class="card"><div class="row between"><input data-dayname data-index="${i}" value="${esc(d.name)}" aria-label="Nombre del día"><button class="danger" data-del-day="${i}">Eliminar día</button></div>${d.exercises.map((e,j)=>`<div class="row between" style="padding:10px 0;border-bottom:1px solid var(--line);gap:8px"><div style="flex:1;min-width:0"><b>${esc(localizedExerciseName(e))}</b><div class="small muted">${Number(e.sets)||3} series · ${esc(e.reps||'8–12')} rep. · descanso ${Number(e.rest)||120} s${e.variant?' · '+esc(e.variant):''}${e.notes?' · '+esc(e.notes):''}</div></div><div class="actions" style="margin:0"><button class="secondary" data-day="${i}" data-edit-ex="${j}">Modificar</button><button class="ghost" data-day="${i}" data-remove-ex="${j}">Quitar</button></div></div>`).join('')}<button class="secondary" style="margin-top:10px" data-add-ex="${i}">＋ Añadir ejercicio</button></div>`}
 function openRoutineExerciseEditor(dayIndex,exerciseIndex){const ex=days[dayIndex]?.exercises[exerciseIndex];if(!ex)return;document.getElementById('routineExerciseModal')?.remove();const overlay=document.createElement('div');overlay.id='routineExerciseModal';overlay.className='exercise-modal-backdrop';overlay.innerHTML=`<section class="exercise-modal" role="dialog" aria-modal="true" aria-labelledby="routineExerciseTitle"><div class="row between"><div><h2 class="exercise-modal-title" id="routineExerciseTitle">${esc(ex.name)}</h2><p class="small muted">Modificar parámetros del ejercicio</p></div><button type="button" class="ghost" id="routineExClose" aria-label="Cerrar">✕</button></div><div class="fieldgrid"><div><label for="routineExSets">Número de series</label><input id="routineExSets" type="number" min="1" max="30" value="${Math.max(1,Number(ex.sets)||3)}"></div><div><label for="routineExReps">Repeticiones objetivo</label><input id="routineExReps" value="${esc(ex.reps||'8–12')}" placeholder="Ej. 8–12"></div><div><label for="routineExRest">Descanso (segundos)</label><input id="routineExRest" type="number" min="1" max="3600" value="${Math.max(1,Number(ex.rest)||120)}"></div><div><label for="routineExVariant">Variante / máquina</label><input id="routineExVariant" value="${esc(ex.variant||'')}" placeholder="Opcional"></div></div><label for="routineExNotes" style="margin-top:12px">Notas</label><textarea id="routineExNotes" rows="3" placeholder="Indicaciones técnicas o recordatorios">${esc(ex.notes||'')}</textarea><div class="actions"><button type="button" id="routineExSave">Guardar cambios</button><button type="button" class="ghost" id="routineExCancel">Cancelar</button></div></section>`;document.body.appendChild(overlay);const close=()=>overlay.remove();overlay.querySelector('#routineExClose').onclick=close;overlay.querySelector('#routineExCancel').onclick=close;overlay.onclick=e=>{if(e.target===overlay)close()};overlay.querySelector('#routineExSave').onclick=()=>{const sets=Math.floor(Number(overlay.querySelector('#routineExSets').value));const rest=Math.floor(Number(overlay.querySelector('#routineExRest').value));const reps=overlay.querySelector('#routineExReps').value.trim();if(!Number.isFinite(sets)||sets<1||sets>30){alert('Indica entre 1 y 30 series.');return}if(!Number.isFinite(rest)||rest<1||rest>3600){alert('El descanso debe estar entre 1 y 3600 segundos.');return}if(!reps){alert('Indica las repeticiones objetivo.');return}Object.assign(ex,{sets,reps,rest,variant:overlay.querySelector('#routineExVariant').value.trim(),notes:overlay.querySelector('#routineExNotes').value.trim()});close();redraw()};overlay.querySelector('#routineExSets').focus()}
 $('#addDay').onclick=(event)=>{event?.preventDefault();days.push({id:uid(),name:'Día '+(days.length+1),exercises:[]});redraw()};$('#saveRoutine').type='button';$('#saveRoutine').onclick=(event)=>{event?.preventDefault();try{const nameInput=$('#rName');if(!nameInput){alert('No se encuentra el campo del nombre de la rutina. Vuelve a abrir el editor.');return}const name=nameInput.value.trim();if(!name){alert('Escribe un nombre para la rutina.');nameInput.focus();return}if(!Array.isArray(days)||!days.length){alert('La rutina debe tener al menos un día.');return}if(!days.some(d=>Array.isArray(d.exercises)&&d.exercises.length)){if(!confirm('La rutina no tiene ejercicios. ¿Quieres guardarla vacía?'))return}copy.name=name;copy.days=days;copy.isTemplate=false;copy.active=isNew?true:!!copy.active;let previous=null;if(isNew){db.routines.push(copy)}else{const idx=db.routines.findIndex(x=>x.id===copy.id);if(idx<0){alert('No se encuentra la rutina que intentas guardar.');return}previous=db.routines[idx];db.routines[idx]=copy}if(!save()){if(isNew)db.routines=db.routines.filter(x=>x.id!==copy.id);else{const idx=db.routines.findIndex(x=>x.id===copy.id);if(idx>=0)db.routines[idx]=previous}return}if(isNew){window.chooseRoutine=copy.id;$('#main').innerHTML=chooseDayView(copy);bind();window.scrollTo(0,0)}else go('routines')}catch(error){console.error('Error al guardar la rutina:',error);alert('No se ha podido guardar la rutina. Tus cambios siguen en pantalla; prueba de nuevo o exporta una copia de seguridad.')}};$('#cancelRoutine').onclick=(event)=>{event?.preventDefault();go('routines')};bindDayControls()}

function editExercise(e,callback){let isNew=!e;$('#main').innerHTML=`<div class="title">${isNew?'Crear ejercicio':'Editar ejercicio'}</div><div class="card"><label>Nombre</label><input id="exName" value="${esc(e?.name||'')}"><div class="fieldgrid"><div><label>Grupo muscular</label><input id="exGroup" list="groups" value="${esc(e?.group||'General y funcional')}"><datalist id="groups">${[...new Set(db.library.map(x=>x.group))].map(g=>`<option>${esc(g)}</option>`).join('')}</datalist></div><div><label>Subgrupo</label><input id="exSub" value="${esc(e?.subgroup||'General')}"></div><div><label>Equipamiento</label><input id="exEquipment" value="${esc(e?.equipment||'Máquina')}"></div><div><label>Variante/máquina (opcional)</label><input id="exVariant" value="${esc(e?.variant||'')}"></div></div><div class="actions"><button id="saveEx">Guardar ejercicio</button><button class="ghost" id="cancelEx">Cancelar</button></div></div>`;$('#saveEx').onclick=()=>{let name=$('#exName').value.trim();if(!name){alert('Escribe el nombre del ejercicio.');return}let obj={...(e||exercise(name,$('#exGroup').value,$('#exSub').value,$('#exEquipment').value)),name,group:$('#exGroup').value||'General y funcional',subgroup:$('#exSub').value||'General',equipment:$('#exEquipment').value||'Otro',variant:$('#exVariant').value,isCustom:true};if(isNew)db.library.push(obj);else db.library[db.library.findIndex(x=>x.id===e.id)]=obj;save();if(callback)callback(obj);else go('library')};$('#cancelEx').onclick=()=>go('library')}
function importText(){
 const html=`<div class="title">Crear rutina</div><div class="card"><p class="muted small">Pega tu entrenamiento tal como lo tengas escrito. Detectaremos los días, ejercicios, series y repeticiones. Podrás revisar y corregirlo antes de guardarlo.</p><div class="fieldgrid"><div><label for="importRoutineName">Nombre de la rutina</label><input id="importRoutineName" placeholder="Ej. Hipertrofia 4 días" value="Rutina importada"></div><div><label for="importDayCount">Número de días</label><select id="importDayCount">${[1,2,3,4,5,6,7].map(n=>`<option value="${n}" ${n===4?'selected':''}>${n} ${n===1?'día':'días'}</option>`).join('')}</select></div></div><label for="importSource" style="margin-top:12px">Texto de la rutina</label><textarea id="importSource" rows="13" placeholder="Día 1: Pecho y tríceps&#10;Press banca 4x12,10,8,6&#10;Aperturas en polea 3 x 12&#10;Fondos 3 series de 10 repeticiones&#10;&#10;Día 2: Espalda y bíceps&#10;Jalón al pecho 4x10&#10;Remo sentado 3x12"></textarea><div class="actions"><button id="parseText">Analizar rutina</button><button class="ghost" data-go="routines">Cancelar</button></div></div><div id="importPreview"></div>`;
 $('#main').innerHTML=html;
 $('#parseText').onclick=()=>{
  const source=$('#importSource').value.trim();if(!source){alert('Pega el texto de tu entrenamiento.');return}
  const routineName=$('#importRoutineName').value.trim()||'Rutina importada';
  const requestedDays=Math.max(1,Math.min(7,Number($('#importDayCount').value)||4));
  const lines=source.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  const parsed=[];const headers=[];let currentHeader=null;
  const weekdayMap={'lunes':0,'martes':1,'miércoles':2,'miercoles':2,'jueves':3,'viernes':4,'sábado':5,'sabado':5,'domingo':6};
  const normalize=t=>String(t||'').toLocaleLowerCase('es').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
  const findLocal=name=>{const n=normalize(name);let found=db.library.find(e=>normalize(e.name)===n)||db.library.find(e=>(e.aliases||[]).some(a=>normalize(a)===n))||null;if(found?.referenceExerciseId)return found;const ref=referenceExercises.length?matchReference(name,referenceExercises):null;if(ref){const linked=db.library.find(e=>e.referenceExerciseId===ref.id);if(linked)return linked}return found};
  const addExercise=(raw,sets,reps,header)=>{raw=raw.replace(/^[-•*]\s*/,'').replace(/[\s:–—-]+$/,'').trim();if(!raw)return;const found=findLocal(raw);parsed.push({id:uid(),exerciseId:found?.id||raw,name:raw,variant:'',sets:Math.max(1,Math.min(30,Number(sets)||3)),reps:String(reps||'12').trim(),rest:120,notes:found?'':'Revisar ejercicio importado',metric:/s\b|seg|minuto/i.test(String(reps))?'duration':'reps',needsReview:!found,sourceHeader:header,dayIndex:null,referenceExerciseId:found?.referenceExerciseId||''})};
  const dayHeader=/^(?:(?:día|dia|day)\s*(\d+)?\s*[:.\-–—]?\s*(.*)|(?:lunes|martes|miércoles|miercoles|jueves|viernes|sábado|sabado|domingo)\b\s*[:.\-–—]?\s*(.*))$/i;
  const seriesPatterns=[
   /^(.+?)\s*[-:–—]?\s*(\d{1,2})\s*[x×]\s*(\d{1,2}(?:\s*[-–]\s*\d{1,2})?(?:\s*,\s*\d{1,2})*(?:\s*(?:s|seg|segundos|min|minutos|pasos|por\s+lado))?)\s*$/i,
   /^(.+?)\s*[-:–—]?\s*(\d{1,2})\s+series?\s+de\s+(\d{1,2}(?:\s*[-–]\s*\d{1,2})?(?:\s*,\s*\d{1,2})*)\s*(?:reps?|repeticiones?)?\s*$/i,
   /^(\d{1,2})\s*[x×]\s*(\d{1,2}(?:\s*[-–]\s*\d{1,2})?(?:\s*,\s*\d{1,2})*)\s+(.+)$/i
  ];
  for(let li=0;li<lines.length;li++){
   const line=lines[li];let m=null,kind=-1;for(let i=0;i<seriesPatterns.length;i++){m=line.match(seriesPatterns[i]);if(m){kind=i;break}}
   if(m){if(kind===2)addExercise(m[3],m[1],m[2],currentHeader);else addExercise(m[1],m[2],m[3],currentHeader);continue}
   const h=line.match(dayHeader);const weekday=line.toLocaleLowerCase('es').match(/^(lunes|martes|miércoles|miercoles|jueves|viernes|sábado|sabado|domingo)\b/);
   const isExplicitHeader=!!h||/[:：]$/.test(line)||/^(grupo|bloque|entrenamiento)\s*\d*/i.test(line);
   const nextLine=lines[li+1]||'';const nextIsExercise=seriesPatterns.some(p=>p.test(nextLine));const looksLikeGroup=/(pecho|espalda|pierna|hombro|brazo|bíceps|biceps|tríceps|triceps|glúteo|gluteo|femoral|cuádriceps|cuadriceps|core|full body|push|pull|legs)/i.test(line)&&line.length<45&&!/\d/.test(line)&&nextIsExercise;
   if(isExplicitHeader||looksLikeGroup){let idx=null,label=line.replace(/[:：]$/,'').trim();if(h&&h[1])idx=Math.max(0,Number(h[1])-1);else if(weekday)idx=weekdayMap[weekday[1]];currentHeader={label,index:idx,sequence:headers.length};headers.push(currentHeader);continue}
   // Una línea de ejercicio sin esquema explícito se conserva y recibe el valor estándar 3x12.
   addExercise(line,3,'12',currentHeader);
  }
  if(!parsed.length){alert('No he podido detectar ejercicios. Escribe al menos un ejercicio por línea; por ejemplo: Press banca 3x12.');return}
  const days=Array.from({length:requestedDays},(_,i)=>({id:uid(),name:`Día ${i+1}`,exercises:[]}));
  const explicit=parsed.some(e=>e.sourceHeader!==null);
  if(explicit){let next=0;const headerMap=new Map();for(const h of headers){let idx=Number.isInteger(h.index)?Math.min(requestedDays-1,Math.max(0,h.index)):Math.min(requestedDays-1,next);headerMap.set(h,idx);if(h.label)days[idx].name=h.label;next=Math.min(requestedDays-1,idx+1)}parsed.forEach((e,i)=>{let idx=e.sourceHeader?headerMap.get(e.sourceHeader):Math.min(requestedDays-1,Math.floor(i*requestedDays/parsed.length));e.dayIndex=Number.isInteger(idx)?idx:0;days[e.dayIndex].exercises.push(e)})}
  else parsed.forEach((e,i)=>{const idx=Math.min(requestedDays-1,Math.floor(i*requestedDays/parsed.length));e.dayIndex=idx;days[idx].exercises.push(e)});
  days.forEach((d,i)=>{if(!d.name||/^Día \d+$/.test(d.name))d.name=`Día ${i+1}`});
  let routine={id:uid(),name:routineName,days};
  const syncPreview=()=>{routine.name=$('#previewName')?.value.trim()||routine.name;routine.days.forEach((d,di)=>{const dayInput=$(`[data-prev-dayname="${di}"]`);if(dayInput)d.name=dayInput.value.trim()||`Día ${di+1}`;d.exercises.forEach((e,ei)=>{const n=$(`[data-prev-name="${di}-${ei}"]`),sets=$(`[data-prev-sets="${di}-${ei}"]`),reps=$(`[data-prev-reps="${di}-${ei}"]`);if(n)e.name=n.value.trim()||'Ejercicio';if(sets)e.sets=Math.max(1,Math.min(30,Number(sets.value)||3));if(reps)e.reps=reps.value.trim()||'12'})})};
  const renderPreview=()=>{$('#importPreview').innerHTML=`<div class="card"><div class="subtitle">Revisa tu rutina antes de guardarla</div><p class="muted small">Puedes cambiar nombres, series, repeticiones y mover ejercicios entre días. Los ejercicios no reconocidos se guardarán con el nombre que has escrito para que puedas corregirlos después.</p><label>Nombre</label><input id="previewName" value="${esc(routine.name)}">${routine.days.map((d,di)=>`<div class="card" style="margin-top:12px"><div class="row between"><input data-prev-dayname="${di}" value="${esc(d.name)}" aria-label="Nombre del día"><span class="pill">${d.exercises.length} ejercicios</span></div>${d.exercises.map((e,ei)=>`<div class="exercise"><div class="row between"><div style="flex:1;min-width:0"><input data-prev-name="${di}-${ei}" value="${esc(e.name)}"><div class="fieldgrid"><div><label>Series</label><input type="number" min="1" max="30" data-prev-sets="${di}-${ei}" value="${e.sets}"></div><div><label>Repeticiones</label><input data-prev-reps="${di}-${ei}" value="${esc(e.reps)}"></div></div>${e.needsReview?'<span class="pill">Revisar ejercicio</span>':''}</div><button type="button" class="ghost" data-prev-del="${e.id}">Quitar</button></div><label style="margin-top:8px">Mover a otro día</label><select data-prev-move="${e.id}">${routine.days.map((dest,k)=>`<option value="${k}" ${k===di?'selected':''}>${esc(dest.name)}</option>`).join('')}</select></div>`).join('')||'<p class="muted small">Sin ejercicios.</p>'}</div>`).join('')}<div class="actions"><button id="saveImported">Guardar rutina</button><button class="secondary" id="backImported">Volver al texto</button><button class="ghost" id="cancelImported">Cancelar</button></div></div>`;
   $$('[data-prev-dayname]').forEach(inp=>inp.onchange=()=>{syncPreview();routine.days[Number(inp.dataset.prevDayname)].name=inp.value.trim()||`Día ${Number(inp.dataset.prevDayname)+1}`;renderPreview()});
   $$('[data-prev-move]').forEach(sel=>sel.onchange=()=>{syncPreview();const exId=sel.dataset.prevMove;let from=-1,fromIndex=-1,obj=null;routine.days.forEach((d,di)=>{const ei=d.exercises.findIndex(e=>e.id===exId);if(ei>=0){from=di;fromIndex=ei;obj=d.exercises.splice(ei,1)[0]}});const to=Number(sel.value);if(obj&&to!==from)routine.days[to].exercises.push(obj);else if(obj)routine.days[from].exercises.splice(fromIndex,0,obj);renderPreview()});
   $$('[data-prev-del]').forEach(btn=>btn.onclick=()=>{syncPreview();routine.days.forEach(d=>d.exercises=d.exercises.filter(e=>e.id!==btn.dataset.prevDel));renderPreview()});
   $('#saveImported').onclick=()=>{syncPreview();if(!routine.name.trim()){alert('Escribe un nombre para la rutina.');return}if(!routine.days.some(d=>d.exercises.length)){alert('La rutina no tiene ejercicios.');return}routine.days.forEach(d=>d.exercises.forEach(e=>{let local=findLocal(e.name);if(!local){local=exercise(e.name,'General y funcional','General','Otro');local.isCustom=true;db.library.push(local)}e.exerciseId=local.id;e.referenceExerciseId=local.referenceExerciseId||e.referenceExerciseId||'';delete e.needsReview;delete e.sourceHeader;delete e.dayIndex}));routine.isTemplate=false;routine.active=true;db.routines.push(routine);if(!save()){db.routines=db.routines.filter(r=>r.id!==routine.id);return}go('routines');offerBackupReminder()};
   $('#backImported').onclick=()=>{syncPreview();$('#importPreview').innerHTML='';$('#importSource').focus()};$('#cancelImported').onclick=()=>go('routines');
  };renderPreview();
 };
}

function copyAppLink(){
 const url='https://jmrb92.github.io/GYMLOG/';
 // Abrir siempre una interfaz visible; no depender de que el navegador permita copiar en segundo plano.
 document.getElementById('shareGymModal')?.remove();
 const wrap=document.createElement('div');wrap.id='shareGymModal';wrap.style.cssText='position:fixed;inset:0;background:#17212699;z-index:9999;display:flex;align-items:center;justify-content:center;padding:18px';
 wrap.innerHTML=`<div role="dialog" aria-modal="true" aria-labelledby="shareGymTitle" class="card" style="max-width:480px;width:100%;box-shadow:0 12px 40px #0004"><div class="row between"><div class="subtitle" id="shareGymTitle">Compartir GYM LOG</div><button type="button" class="ghost" id="shareGymClose" aria-label="Cerrar">✕</button></div><p>Comparte este enlace con tu amigo:</p><input id="shareGymUrl" type="text" readonly value="${url}" style="margin:4px 0 10px"><div id="shareGymStatus" class="small muted" role="status" style="margin:5px 0 10px">Pulsa «Copiar enlace» o selecciona y copia la dirección.</div><div class="actions"><button type="button" id="shareGymCopy">Copiar enlace</button><button type="button" class="secondary" id="shareGymNative">Compartir…</button><button type="button" class="ghost" id="shareGymSelect">Seleccionar enlace</button></div></div>`;
 document.body.appendChild(wrap);
 const field=wrap.querySelector('#shareGymUrl'),status=wrap.querySelector('#shareGymStatus'),close=()=>wrap.remove();
 wrap.querySelector('#shareGymClose').onclick=close;wrap.onclick=e=>{if(e.target===wrap)close()};
 wrap.querySelector('#shareGymSelect').onclick=()=>{field.focus();field.select();status.textContent='Enlace seleccionado. Usa Ctrl+C (o Mantén pulsado y Copiar en el móvil).'};
 wrap.querySelector('#shareGymCopy').onclick=async()=>{let copied=false;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(url);copied=true}}catch(e){}if(!copied){try{field.focus();field.select();copied=document.execCommand('copy')}catch(e){copied=false}}status.textContent=copied?'Enlace copiado. Ya puedes pegarlo y enviarlo.':'El navegador no permitió copiar automáticamente. El enlace está seleccionado; cópialo manualmente.';if(!copied){field.focus();field.select()}};
 wrap.querySelector('#shareGymNative').onclick=async()=>{try{if(navigator.share){await navigator.share({title:'GYM LOG',text:'Prueba GYM LOG para organizar tus entrenamientos:',url});status.textContent='Se ha abierto el menú para compartir.'}else{field.focus();field.select();status.textContent='Este navegador no ofrece el menú de compartir. Copia el enlace seleccionado.'}}catch(e){if(e?.name!=='AbortError')status.textContent='No se pudo abrir el menú de compartir. Puedes copiar el enlace manualmente.'}};
 field.focus();field.select();
}
async function shareRoutine(r){const data=JSON.stringify({format:'gymlog-routine',version:1,routine:r},null,2);const filename=`${safeName(r.name)}.gymlog`;try{const file=new File([data],filename,{type:'application/json'});if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({title:`Rutina ${r.name} · GYM LOG`,text:'Te comparto esta rutina para importarla en GYM LOG.',files:[file]});return}}catch(e){if(e?.name==='AbortError')return}download(data,filename,'application/json');alert('Se ha exportado únicamente esta rutina. Envíale el archivo .gymlog a tu amigo; podrá importarlo sin compartir tus otras rutinas ni tu historial.')}

function viewSession(id){let s=db.sessions.find(s=>s.id===id);if(!s)return;$('#main').innerHTML=`<div class="title">${esc(s.routineNameSnapshot)} · ${esc(s.dayNameSnapshot)}</div><div class="card"><div class="muted">${new Date(s.completedAt).toLocaleString('es-ES',{dateStyle:'full',timeStyle:'short'})}</div>${s.exercises.map(e=>`<div class="exercise"><b>${esc(e.exerciseNameSnapshot)}</b><div class="small muted">${esc(e.variant||'')}</div>${e.sets.map((x,i)=>`<div class="row between small" style="padding:4px 0"><span>Serie ${i+1}</span><span>${x.weight!==''?esc(x.weight)+' '+db.settings.unit+' × ':''}${esc(x.reps||x.duration||'—')} ${x.completed?'✓':'—'}</span></div>`).join('')}${e.notes?`<p class="small muted">${esc(e.notes)}</p>`:''}</div>`).join('')}<button class="secondary" data-go="history">Volver al historial</button></div>`;bind()}
function dayNameFromRoutine(r){return r.days[0]?.id||''}
function offerBackupReminder(){const pref=db.settings?.backupReminder||{mode:'ask',until:0};if(pref.mode==='never'||(pref.mode==='snooze'&&Date.now()<Number(pref.until||0)))return;if($('#backupReminderModal'))return;const wrap=document.createElement('div');wrap.id='backupReminderModal';wrap.style.cssText='position:fixed;inset:0;background:#17212688;z-index:100;display:flex;align-items:center;justify-content:center;padding:18px';wrap.innerHTML=`<div class="card" style="max-width:440px;width:100%;box-shadow:0 12px 40px #0003"><div class="subtitle">¿Hacemos una copia de seguridad?</div><p>Has guardado cambios importantes. Descarga un archivo en tu dispositivo para poder recuperar tus rutinas y entrenamientos si borras los datos del navegador o cambias de móvil.</p><div class="actions"><button id="backupReminderNow">Descargar copia ahora</button><button class="secondary" id="backupReminderWeek">No recordar esta semana</button><button class="ghost" id="backupReminderNever">No recordar nunca</button><button class="ghost" id="backupReminderClose">Ahora no</button></div></div>`;document.body.appendChild(wrap);const close=()=>wrap.remove();$('#backupReminderNow').onclick=()=>{download(JSON.stringify({...db,exportedAt:now(),format:'gymlog-backup'},null,2),'gymlog-copia-'+new Date().toISOString().slice(0,10)+'.json','application/json');close()};$('#backupReminderWeek').onclick=()=>{db.settings.backupReminder={mode:'snooze',until:Date.now()+7*864e5};save();close()};$('#backupReminderNever').onclick=()=>{db.settings.backupReminder={mode:'never',until:0};save();close()};$('#backupReminderClose').onclick=close;wrap.onclick=e=>{if(e.target===wrap)close()}}
function download(content,name,type){let blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function safeName(s){return String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'rutina'}
function restoreFile(ev){
 const f=ev.target.files?.[0];if(!f)return;
 const reader=new FileReader();
 reader.onload=()=>{
  try{
   const obj=JSON.parse(reader.result);
   const remapRoutine=(source)=>{
    const r=JSON.parse(JSON.stringify(source));r.id=uid();r.isTemplate=false;r.active=true;r.createdAt=r.createdAt||now();
    if(!Array.isArray(r.days)||!r.days.length)throw Error('La rutina importada no contiene días.');
    r.days.forEach(d=>{d.id=uid();d.name=String(d.name||'Día');if(!Array.isArray(d.exercises))d.exercises=[];d.exercises.forEach(e=>{e.id=uid();const name=String(e.name||'Ejercicio');let local=db.library.find(x=>x.name.toLocaleLowerCase('es')===name.toLocaleLowerCase('es'));if(!local){local={...exercise(name,'General y funcional','General','Otro'),isCustom:true};db.library.push(local)}e.name=name;e.exerciseId=local.id;e.sets=Math.max(1,Number(e.sets)||3);e.reps=String(e.reps||'8–12');if(!e.metric)e.metric='reps';if(!e.rest)e.rest=120})});
    if(db.routines.some(x=>x.name===r.name))r.name+=' (importada)';return r;
   };
   if(obj.format==='gymlog-routine'&&obj.routine){db.routines.push(remapRoutine(obj.routine))}
   else if(obj.format==='gymlog-backup'&&Array.isArray(obj.library)&&Array.isArray(obj.routines)&&Array.isArray(obj.sessions)){
    if(!confirm('¿Fusionar la copia con los datos actuales? Aceptar = fusionar, Cancelar = reemplazar.')){
     if(!confirm('¿Seguro que quieres reemplazar todos los datos actuales?'))return;
     db=JSON.parse(JSON.stringify(obj));delete db.exportedAt;
    }else{
     const existingNames=new Set(db.routines.map(r=>r.name));
     obj.routines.forEach(source=>{if(!existingNames.has(source.name)){const r=JSON.parse(JSON.stringify(source));db.routines.push(r);existingNames.add(r.name)}});
     const sessionIds=new Set(db.sessions.map(s=>s.id));db.sessions.push(...obj.sessions.filter(s=>!sessionIds.has(s.id)));
     const exerciseIds=new Set(db.library.map(e=>e.id));db.library.push(...obj.library.filter(e=>!exerciseIds.has(e.id)));
     if(!db.activeSession&&obj.activeSession)db.activeSession=JSON.parse(JSON.stringify(obj.activeSession));
    }
   }else if(obj.format==='gymlog-routines'&&Array.isArray(obj.routines)){obj.routines.forEach(r=>db.routines.push(remapRoutine(r)))}
   else throw Error('Formato no reconocido');
   normalizeDatabase();save();alert('Importación completada.');go('home');
  }catch(e){alert('No se pudo importar el archivo: '+(e?.message||'archivo no válido'))}
  ev.target.value='';
 };
 reader.onerror=()=>{alert('No se pudo leer el archivo seleccionado.');ev.target.value=''};
 reader.readAsText(f);
}

function getRemaining(){return timer.running?Math.max(0,(timer.end-Date.now())/1000):timer.remaining}
function formatTime(sec){sec=Math.max(0,Math.ceil(sec));return `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`}
function tick(){if(timer.running){timer.remaining=getRemaining();if(timer.remaining<=0){timer.running=false;timer.remaining=0;try{if(navigator.vibrate)navigator.vibrate([250,120,250])}catch(e){}if(page==='timer')render();else{const btn=$('[data-action="open-timer"]');if(btn)btn.textContent='⏱ Descanso terminado'}}else if(page==='timer'){let d=$('#timerDigits');if(d)d.textContent=formatTime(timer.remaining);let sub=$('#topSub');if(sub)sub.textContent='Descanso: '+formatTime(timer.remaining)}}}
function editUnused(){}
$('#quickResume').onclick=()=>{page='workout';render()};document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});load();save();render();showPrivacyNotice();(async()=>{await syncExternalTemplates();await loadProConfig();await loadReferenceLibrary()})();setInterval(tick,250);
})();
